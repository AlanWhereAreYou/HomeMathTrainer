services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: homemath-api
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: homemath-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

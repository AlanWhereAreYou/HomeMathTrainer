services:
  app:
    image: ghcr.io/alanwhereareyou/home-math-trainer:latest
    container_name: homemath-app
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      # Host port 8100 maps to the app's internal HTTP port 3000.
      - "${HOST_PORT:-8100}:3000"
